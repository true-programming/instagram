services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Trueprogramming\Instagram\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # TYPO3 v12 creates FormEngine nodes via makeInstance(), which needs a public service
  Trueprogramming\Instagram\Form\Element\InstagramTokenState:
    public: true
    shared: false
